# Prometheus 告警规则 —— 企业团队文档开发平台（md-docs）
#
# 所有指标来自后端 `/metrics`（Prometheus 文本格式，无需 prometheus_client）：
#   http_requests_total{method,path}              请求计数（counter）
#   http_errors_total{method,path}                 5xx 计数（counter）
#   http_request_duration_seconds_bucket{...,le}   延迟直方图（histogram）
#   md_backup_last_success_timestamp / _failure    备份成功/失败时间戳（gauge, unix epoch）
#   md_backup_failures_total                       备份累计失败数（counter）
#   md_leader_is_leader / md_leader_changes_total  leader 身份（gauge 0/1）/ 抢主次数（counter）
#
# 部署：prometheus.yml 中 `rule_files: [../../deploy/observability/alerts.yml]`。
# Alertmanager 路由按 severity 分发（critical → oncall PG，warning → 频道）。
groups:
  - name: md-docs.red
    interval: 30s
    rules:
      # 错误率：5xx 占比 > 5% 持续 5 分钟
      - alert: MdHighErrorRate
        expr: |
          sum(rate(http_errors_total[2m]))
            / clamp_min(sum(rate(http_requests_total[2m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
          team: md-docs
        annotations:
          summary: "5xx 错误率 > 5%"
          description: "近 2 分钟 5xx 错误率 {{ $value | humanizePercentage }}，持续 5 分钟。排查 /metrics 中 path 维度定位热点路由。"

      # p99 延迟：> 2s 持续 10 分钟
      - alert: MdHighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
          team: md-docs
        annotations:
          summary: "p99 延迟 > 2s"
          description: "全局 p99 延迟 {{ $value | humanizeDuration }}，持续 10 分钟。检查连接池 LRU 淘汰压力（md_total_idle_connections/limit）与慢查询。"

      # 错误绝对量：单路由 5xx 突增（定位热点路径）
      - alert: MdRouteErrorSpike
        expr: |
          sum by (method, path) (rate(http_errors_total[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          team: md-docs
        annotations:
          summary: "路由 {{ $labels.method }} {{ $labels.path }} 5xx 突增"
          description: "该路由 5xx 速率 {{ $value }}/s，持续 5 分钟。"

  - name: md-docs.ops
    interval: 30s
    rules:
      # 备份失败：最近 1 小时内有失败记录
      - alert: MdBackupFailedRecently
        expr: increase(md_backup_failures_total[1h]) > 0
        for: 1m
        labels:
          severity: critical
          team: md-docs
        annotations:
          summary: "定时备份失败"
          description: "近 1 小时内有 {{ $value }} 次备份失败。查后端日志『定时备份失败』与 BACKUP_DIR 权限/磁盘空间。"

      # 备份过期：曾成功但超过 26 小时无新成功（假定 BACKUP_INTERVAL_HOURS≈24，按实际调参）
      - alert: MdBackupStale
        expr: |
          md_backup_last_success_timestamp > 0
            and on() (time() - md_backup_last_success_timestamp > 26 * 3600)
        for: 10m
        labels:
          severity: warning
          team: md-docs
        annotations:
          summary: "备份已过期（>26h 无成功）"
          description: "距上次成功备份已超过 26 小时。确认 BACKUP_INTERVAL_HOURS>0 且 leader 实例存活。"

      # leader 抖动：15 分钟内抢主 > 2 次（Redis 抖动 / 实例反复重启）
      - alert: MdLeaderFlap
        expr: increase(md_leader_changes_total[15m]) > 2
        for: 2m
        labels:
          severity: warning
          team: md-docs
        annotations:
          summary: "leader 频繁切换"
          description: "15 分钟内 leader 变更 {{ $value }} 次。检查 Redis 连接稳定性与实例健康（仅 LEADER_ELECTION_ENABLED=true 时生效）。"

      # 无 leader：选举启用但本实例非主（多实例全部失主 → 全部实例同时报警）
      - alert: MdNoLeader
        expr: md_leader_is_leader == 0
        for: 5m
        labels:
          severity: warning
          team: md-docs
        annotations:
          summary: "当前实例未持主（无 leader）"
          description: "LEADER_ELECTION_ENABLED=true 但本实例 5 分钟未获得租约。检查 Redis 可达性与 LEADER_LEASE_TTL_SECONDS。"
