apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: { app.kubernetes.io/name: md-docs }
spec:
  type: {{ .Values.service.type }}
  ports: [{ port: {{ .Values.service.port }}, targetPort: 8000, protocol: TCP }]
  selector: { app.kubernetes.io/name: md-docs, app.kubernetes.io/component: backend }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels: { app.kubernetes.io/name: md-docs }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 5Gi }
{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels: { app.kubernetes.io/name: md-docs, app.kubernetes.io/component: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: redis } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: md-docs, app.kubernetes.io/component: redis }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
          volumeMounts: [{ name: redis-data, mountPath: /data }]
          livenessProbe: { exec: { command: ["redis-cli", "ping"] } }
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-redis-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.redis.persistence.size }} } }
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: { app.kubernetes.io/name: md-docs }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend: { service: { name: {{ $.Release.Name }}, port: { number: {{ $.Values.service.port }} } } }
          {{- end }}
    {{- end }}
{{- end }}
