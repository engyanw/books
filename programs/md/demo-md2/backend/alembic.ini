# Alembic 配置。迁移脚本目录 migrations/，使用 DATABASE_URL（PG）或 REGISTRY_DB_PATH（SQLite）。
# 用法：
#   alembic upgrade head      # 应用所有迁移
#   alembic stamp head        # 标记当前已有库已到最新（不实际执行，用于现有部署）
#   alembic revision -m "msg" # 生成新空迁移脚本（手写 op 操作）
[alembic]
script_location = migrations
# 渲染时在 transaction 外自动开始/提交（标准）
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
